# Runs the end-to-end tests on every push and pull request.
# (Deployment is handled by Google Cloud Run's own GitHub connection - see README.)
name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --quiet -r requirements.txt
      - run: python tests/test_pipeline.py
